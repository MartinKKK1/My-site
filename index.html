
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой первый сервер</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 60px 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 35px;
      background: #1e293b;
      border-radius: 20px;
    }

    h1 { color: #38bdf8; }

    button {
      padding: 14px 25px;
      border: 0;
      border-radius: 10px;
      background: #38bdf8;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Мой личный сайт 🚀</h1>
    <p>Я создал этот server прямо с iPhone!</p>
    <button onclick="hello()">Нажми меня</button>
    <p id="message"></p>
  </div>

  <script>
    function hello() {
      document.getElementById("message").textContent =
        "Сервер работает! 🎉";
    }
  </script>
</body>
</html>
